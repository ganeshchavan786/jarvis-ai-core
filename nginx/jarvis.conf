# Jarvis AI Core — Nginx Config
# Static IPs: backend=172.18.0.2, frontend=172.18.0.3
# Copy to: /etc/nginx/sites-enabled/jarvis

server {
    server_name jarvis.vrushaliinfotech.com;

    # Frontend (Next.js) — fixed IP
    location / {
        proxy_pass http://172.18.0.3:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # Backend API — fixed IP
    location /api/ {
        proxy_pass http://172.18.0.2:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        # Large uploads साठी (audio, documents)
        client_max_body_size 50m;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/jarvis.vrushaliinfotech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jarvis.vrushaliinfotech.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = jarvis.vrushaliinfotech.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name jarvis.vrushaliinfotech.com;
    return 404;
}
